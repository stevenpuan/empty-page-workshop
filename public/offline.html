<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06b6d4">
<title>目前離線</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
         background:#ffffff; color:#0f172a; padding:16px; box-sizing:border-box; }
  @media (prefers-color-scheme: dark) { body { background:#0f172a; color:#f1f5f9; } }
  .box { max-width:360px; text-align:center; }
  img { width:72px; height:72px; border-radius:16px; }
  h1 { font-size:20px; margin:16px 0 8px; }
  p { font-size:14px; opacity:.75; line-height:1.6; margin:0 0 20px; }
  button { font-size:16px; padding:10px 20px; border-radius:8px; border:0; background:#06b6d4; color:#fff; }
</style>
</head>
<body>
<div class="box">
  <img src="/icons/icon-192.png" alt="">
  <h1>目前沒有網路連線</h1>
  <p>打卡需要連線才能送出。請確認行動數據或 Wi-Fi 後再試一次。</p>
  <button onclick="location.reload()">重新整理</button>
</div>
</body>
</html>
